[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "voice_commands"
version = "0.0.1"
description = "A classifier of voice commands"
authors = [
  { name = "Rudobrody" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = ">=3.10.0"


[tool.ruff]
line-length = 99
src = ["voice_commands"]
include = ["pyproject.toml", "voice_commands/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["voice_commands"]
force-sort-within-sections = true

